name: ETF Informe Detallado
on:
  workflow_dispatch:
    inputs:
      vercel_url:
        description: 'Vercel URL'
        required: true
        default: 'https://ethan-inversiones.vercel.app'

jobs:
  informe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ticker: [FDN, REMX, ARKG, KBWB, PBS, COPX, IHI, PHO, IBUY]
      fail-fast: false
    steps:
      - name: Consultar ${{ matrix.ticker }}
        run: |
          BASE_URL="${{ github.event.inputs.vercel_url }}"
          TICKER="${{ matrix.ticker }}"
          BYPASS="${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"
          
          BODY=$(curl -sf --max-time 60 \
            -H "x-vercel-protection-bypass: ${BYPASS}" \
            "${BASE_URL}/api/macro-rlab/etf-holdings?ticker=${TICKER}" 2>/dev/null)
          
          if [ -z "$BODY" ]; then
            echo "ERROR: No response"
            exit 1
          fi
          
          echo "$BODY" | python3 -c "
import sys, json
d = json.load(sys.stdin)
h = d.get('holdings', [])
total = len(h)
con_ticker = sum(1 for x in h if x.get('ticker') and x.get('ticker') != 'null')
sin_ticker = total - con_ticker
cobertura = round(con_ticker/total*100, 1) if total > 0 else 0
src = d.get('source', 'unknown')
fecha = d.get('effectiveDate', d.get('referenceDate', 'N/A'))
series_id = d.get('seriesId', 'N/A')
print('=== ${TICKER} ===')
print(f'  Holdings totales:     {total}')
print(f'  Con ticker:           {con_ticker}')
print(f'  Sin ticker:           {sin_ticker}')
print(f'  Cobertura frontend:   {cobertura}%')
print(f'  Fuente:               {src}')
print(f'  Fecha efectiva:       {fecha}')
print(f'  SeriesId:             {series_id}')
print(f'  OK para ETHAN:        {con_ticker > 0}')
"
