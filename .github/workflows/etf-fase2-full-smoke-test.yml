name: ETF Fase2 Full Smoke Test

"on":
  workflow_dispatch:
    inputs:
      vercel_url:
        description: 'URL de Vercel a testear (ej. https://ethan-xxx.vercel.app)'
        required: true
        type: string

# El bypass secret se obtiene de secrets.VERCEL_AUTOMATION_BYPASS_SECRET
# NUNCA debe introducirse manualmente — el secret del repositorio se usa automáticamente

jobs:
  smoke-test:
    name: Test ${{ matrix.ticker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ticker:
          # ── Tecnología ─────────────────────────────────────────────────
          - SOXX   # iShares Semiconductor ETF
          - IGV    # iShares Expanded Tech-Software Sector ETF
          - CIBR   # First Trust NASDAQ Cybersecurity ETF
          - AIQ    # Global X Artificial Intelligence & Technology ETF
          - SKYY   # First Trust ISE Cloud Computing Index Fund
          - BOTZ   # Global X Robotics & Artificial Intelligence ETF
          - QTUM   # Defiance Quantum ETF (EDGAR NPORT-P)
          - FDN    # First Trust Dow Jones Internet Index Fund
          # ── Salud ──────────────────────────────────────────────────────
          - IBB    # iShares Nasdaq Biotechnology ETF
          - XBI    # SPDR S&P Biotech ETF
          - IHE    # iShares U.S. Pharmaceuticals ETF
          - IHI    # iShares U.S. Medical Devices ETF
          - IHF    # iShares U.S. Healthcare Providers ETF
          - ARKG   # ARK Genomic Revolution ETF
          # ── Industriales ───────────────────────────────────────────────
          - ITA    # iShares U.S. Aerospace & Defense ETF
          - XAR    # SPDR S&P Aerospace & Defense ETF
          - PAVE   # Global X U.S. Infrastructure Development ETF
          - AIRR   # First Trust RBA American Industrial Renaissance ETF
          - JETS   # U.S. Global Jets ETF (EDGAR)
          - IYT    # iShares U.S. Transportation ETF
          - FIW    # First Trust Water ETF
          - PHO    # Invesco Water Resources ETF (EDGAR NPORT-P)
          # ── Consumo Discrecional ───────────────────────────────────────
          - XRT    # SPDR S&P Retail ETF
          - ITB    # iShares U.S. Home Construction ETF
          - CARZ   # First Trust S-Network Future Vehicles & Technology ETF
          - PEJ    # Invesco Dynamic Leisure & Entertainment ETF (EDGAR)
          - IBUY   # Amplify Online Retail ETF (EDGAR NPORT-P)
          - PBS    # Invesco Dynamic Media ETF (EDGAR NPORT-P)
          - PBJ    # Invesco Dynamic Food & Beverage ETF (EDGAR NPORT-P)
          # ── Consumo Básico ─────────────────────────────────────────────
          - FSTA   # Fidelity MSCI Consumer Staples ETF
          # ── Financieros ────────────────────────────────────────────────
          - KRE    # SPDR S&P Regional Banking ETF
          - KBWB   # Invesco KBW Bank ETF (EDGAR NPORT-P)
          - KIE    # SPDR S&P Insurance ETF (EDGAR NPORT-P)
          - KCE    # SPDR S&P Capital Markets ETF (EDGAR NPORT-P)
          - IYG    # iShares U.S. Financial Services ETF
          - BIZD   # VanEck Business Development Company ETF
          - PSP    # Invesco Global Listed Private Equity ETF (EDGAR)
          # ── Comunicaciones ─────────────────────────────────────────────
          - SOCL   # Global X Social Media ETF
          - IYZ    # iShares U.S. Telecommunications ETF
          - DTCR   # Global X Data Center & Digital Infrastructure ETF
          - FINX   # Global X FinTech ETF
          # ── Energía ────────────────────────────────────────────────────
          - XOP    # SPDR S&P Oil & Gas Exploration & Production ETF
          - FCG    # First Trust Natural Gas ETF
          - TAN    # Invesco Solar ETF (EDGAR NPORT-P)
          - ICLN   # iShares Global Clean Energy ETF
          - GRID   # First Trust NASDAQ Clean Edge Smart Grid ETF
          - OIH    # VanEck Oil Services ETF
          - URA    # Global X Uranium ETF
          - AMLP   # Alerian MLP ETF (EDGAR NPORT-P)
          # ── Materiales ─────────────────────────────────────────────────
          - GDX    # VanEck Gold Miners ETF
          - GDXJ   # VanEck Junior Gold Miners ETF
          - SIL    # Global X Silver Miners ETF (EDGAR — antes asignado a VanEck)
          - REMX   # VanEck Rare Earth/Strategic Metals ETF (VanEck+EDGAR fallback)
          - XME    # SPDR S&P Metals & Mining ETF (EDGAR — antes asignado a VanEck)
          - SLX    # VanEck Steel ETF
          - COPX   # Global X Copper Miners ETF (EDGAR — antes asignado a VanEck)
          - LIT    # Global X Lithium & Battery Tech ETF
          # ── Real Estate ────────────────────────────────────────────────
          - VNQ    # Vanguard Real Estate ETF
          - REET   # iShares Global REIT ETF
          - REM    # iShares Mortgage Real Estate ETF
          # ── Utilities ──────────────────────────────────────────────────
          - NLR    # VanEck Uranium+Nuclear Energy ETF (VanEck+EDGAR fallback)
          - GUNR   # FlexShares Morningstar Global Upstream Natural Resources ETF (EDGAR)
          # ── Defensa / Especiales ───────────────────────────────────────
          - MOO    # VanEck Agribusiness ETF
          - ESPO   # VanEck Video Gaming and eSports ETF (VanEck+EDGAR fallback)

    steps:
      - name: Test ${{ matrix.ticker }} holdings
        id: test
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          TICKER="${{ matrix.ticker }}"
          BASE_URL="${{ inputs.vercel_url }}"

          # Verificar que se proporcionó la URL
          if [ -z "$BASE_URL" ]; then
            echo "❌ ERROR: vercel_url no proporcionada"
            exit 1
          fi

          API_URL="${BASE_URL}/api/macro-rlab/etf-holdings?ticker=${TICKER}"
          echo "=== Testing ${TICKER} ==="
          echo "URL: ${API_URL}"

          # Llamada a la API con timeout generoso para EDGAR (puede tardar)
          RESPONSE=$(curl -s -w "\n__HTTP_STATUS__%{http_code}" \
            -H "x-vercel-protection-bypass: ${BYPASS}" \
            -H "Accept: application/json" \
            --max-time 60 \
            "${API_URL}" 2>&1)

          HTTP_STATUS=$(echo "$RESPONSE" | grep -o '__HTTP_STATUS__[0-9]*' | sed 's/__HTTP_STATUS__//')
          BODY=$(echo "$RESPONSE" | sed 's/__HTTP_STATUS__[0-9]*//')

          echo "HTTP Status: ${HTTP_STATUS}"

          # Fallar si no es HTTP 200
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ FAIL: HTTP ${HTTP_STATUS}"
            echo "Response body:"
            echo "$BODY" | head -c 500
            exit 1
          fi

          # Verificar que el body es JSON válido
          if ! echo "$BODY" | jq . > /dev/null 2>&1; then
            echo "❌ FAIL: respuesta no es JSON válido"
            echo "Body: $(echo "$BODY" | head -c 200)"
            exit 1
          fi

          # Extraer campos con jq — nombres reales del handler
          OK=$(echo "$BODY" | jq -r '.ok // "true"')
          HOLDINGS_COUNT=$(echo "$BODY" | jq -r 'if .totalHoldings then (.totalHoldings | tostring) elif .holdings then (.holdings | length | tostring) else "0" end')
          SOURCE=$(echo "$BODY" | jq -r '.source // "unknown"')
          EFFECTIVE_DATE=$(echo "$BODY" | jq -r '.referenceDate // .effectiveDate // "N/A"')
          TOTAL_WEIGHT=$(echo "$BODY" | jq -r 'if .totalWeight then (.totalWeight | tostring) else "N/A" end')
          IS_STALE=$(echo "$BODY" | jq -r '.stale // false | tostring')
          HAS_WARNING=$(echo "$BODY" | jq -r 'if .dataAgeWarning then "YES" else "NO" end')
          ERROR_MSG=$(echo "$BODY" | jq -r '.error // ""')

          # ── FILTRO FRONTEND: replicar exactamente la lógica de rv-sectores.js ──
          # El frontend filtra: data.holdings.filter(h => h.ticker && h.ticker !== 'null')
          # Si este count es 0, el screener mostrará "Sin empresas" aunque holdings_count > 0
          FRONTEND_VALID_COUNT=$(echo "$BODY" | jq -r '[.holdings[]? | select(.ticker != null and .ticker != "" and .ticker != "null")] | length | tostring')

          # Validar ok=true
          if [ "$OK" = "false" ]; then
            echo "❌ FAIL: ok=false"
            echo "   Error: ${ERROR_MSG}"
            exit 1
          fi

          # Validar holdings raw > 0
          if [ "$HOLDINGS_COUNT" = "0" ] || [ -z "$HOLDINGS_COUNT" ]; then
            echo "❌ FAIL: holdings_count=0 o vacío (API no devuelve holdings)"
            echo "   Body (primeros 300 chars): $(echo "$BODY" | head -c 300)"
            exit 1
          fi

          # ── VALIDACIÓN CRÍTICA: holdings con ticker válido para el FRONTEND ──
          # Esta es la validación que el smoke test anterior NO hacía y causó el falso positivo
          if [ "$FRONTEND_VALID_COUNT" = "0" ] || [ -z "$FRONTEND_VALID_COUNT" ]; then
            echo "❌ FAIL: 0 holdings con ticker válido tras filtro frontend"
            echo "   holdings_count (raw API) = ${HOLDINGS_COUNT}"
            echo "   frontend_valid_count     = 0"
            echo "   DIAGNÓSTICO: La API devuelve holdings pero todos tienen ticker:null"
            echo "   CAUSA PROBABLE: EDGAR NPORT-P sin resolución de ticker (CUSIP no resuelto)"
            echo "   Muestra de holdings sin ticker:"
            echo "$BODY" | jq -r '[.holdings[]? | select(.ticker == null or .ticker == "" or .ticker == "null")] | .[0:3][] | "    name=\(.name) cusip=\(.cusip // "N/A") isin=\(.isin // "N/A")"' 2>/dev/null | head -5
            exit 1
          fi

          # Validar fecha de composición existe
          if [ "$EFFECTIVE_DATE" = "N/A" ] || [ -z "$EFFECTIVE_DATE" ]; then
            echo "⚠️  WARN: referenceDate no disponible para ${TICKER}"
          fi

          echo ""
          echo "✅ OK | ${TICKER}"
          echo "   Holdings raw:        ${HOLDINGS_COUNT}"
          echo "   Holdings con ticker: ${FRONTEND_VALID_COUNT} (visible en frontend)"
          echo "   Fuente:              ${SOURCE}"
          echo "   Fecha efectiva:      ${EFFECTIVE_DATE}"
          echo "   Peso total:          ${TOTAL_WEIGHT}%"
          echo "   Stale:               ${IS_STALE}"
          echo "   Aviso antigüed:      ${HAS_WARNING}"

          # Outputs para el resumen del job
          echo "holdings_count=${HOLDINGS_COUNT}" >> $GITHUB_OUTPUT
          echo "frontend_valid_count=${FRONTEND_VALID_COUNT}" >> $GITHUB_OUTPUT
          echo "source=${SOURCE}" >> $GITHUB_OUTPUT
          echo "effective_date=${EFFECTIVE_DATE}" >> $GITHUB_OUTPUT
          echo "total_weight=${TOTAL_WEIGHT}" >> $GITHUB_OUTPUT
          echo "is_stale=${IS_STALE}" >> $GITHUB_OUTPUT
          echo "has_warning=${HAS_WARNING}" >> $GITHUB_OUTPUT

      - name: Report result
        if: always()
        run: |
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            echo "### ✅ ${{ matrix.ticker }} — OK" >> $GITHUB_STEP_SUMMARY
            echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Holdings raw (API) | ${{ steps.test.outputs.holdings_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Holdings con ticker (frontend)** | **${{ steps.test.outputs.frontend_valid_count }}** |" >> $GITHUB_STEP_SUMMARY
            echo "| Fuente | \`${{ steps.test.outputs.source }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Fecha efectiva | ${{ steps.test.outputs.effective_date }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Peso total | ${{ steps.test.outputs.total_weight }}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Stale | ${{ steps.test.outputs.is_stale }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Aviso antigüedad | ${{ steps.test.outputs.has_warning }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ ${{ matrix.ticker }} — FALLO" >> $GITHUB_STEP_SUMMARY
            echo "Ver logs del job para más detalles." >> $GITHUB_STEP_SUMMARY
          fi

  summary:
    name: Resumen Final
    runs-on: ubuntu-latest
    needs: smoke-test
    if: always()
    steps:
      - name: Resumen del test
        run: |
          echo "## 🧪 Smoke Test ETF Fase 2 — Resultado Final" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL testeada:** ${{ inputs.vercel_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ver resultados individuales por ticker en los jobs anteriores." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Criterios de éxito (alineados con el frontend rv-sectores.js):" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ HTTP 200 en cada ETF" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ \`ok: true\` en la respuesta JSON" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ \`totalHoldings > 0\` (holdings raw en la API)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **\`frontend_valid_count > 0\`** (holdings con ticker válido = visible en screener)" >> $GITHUB_STEP_SUMMARY
          echo "  - Replica exactamente: \`data.holdings.filter(h => h.ticker && h.ticker !== 'null')\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Este check faltaba antes — causó falso positivo (65/65 OK pero 38/63 sin datos en UI)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ \`referenceDate\` presente en la respuesta" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ETFs con EDGAR fallback marcados con \`dataAgeWarning\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Correcciones aplicadas en esta ejecución:" >> $GITHUB_STEP_SUMMARY
          echo "- XME → SPDR Series Trust (CIK 1064642, Serie S000012333)" >> $GITHUB_STEP_SUMMARY
          echo "- SIL → Global X Funds (CIK 1432353, Serie S000028730)" >> $GITHUB_STEP_SUMMARY
          echo "- COPX → Global X Funds (CIK 1432353, Serie S000028727)" >> $GITHUB_STEP_SUMMARY
          echo "- GUNR → FlexShares Trust (CIK 1491978, Serie S000033315)" >> $GITHUB_STEP_SUMMARY
          echo "- REMX → VanEck primario + EDGAR fallback (CIK 1137360, Serie S000030045)" >> $GITHUB_STEP_SUMMARY
          echo "- NLR → VanEck primario + EDGAR fallback (CIK 1137360, Serie S000018475)" >> $GITHUB_STEP_SUMMARY
          echo "- ESPO → VanEck primario + EDGAR fallback (CIK 1137360, Serie S000062930)" >> $GITHUB_STEP_SUMMARY
