name: ETF Holdings Pilot — Informe de resultados

# Ejecutar manualmente desde GitHub Actions tab,
# o automáticamente en cada push a feature/etf-holdings-pilot
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Preview URL de Vercel (sin trailing slash)'
        required: true
        default: 'https://ethan-inversiones-h485ds55b-miguel-angel-s-projects2.vercel.app'
  push:
    branches:
      - feature/etf-holdings-pilot

jobs:
  pilot-test:
    name: Pruebas piloto XBI · CIBR · SMH · GDX
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PREVIEW_URL: ${{ github.event.inputs.preview_url || 'https://ethan-inversiones-h485ds55b-miguel-angel-s-projects2.vercel.app' }}
      BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: 📋 Verificar configuración
        run: |
          echo "Preview URL: $PREVIEW_URL"
          if [ -z "$BYPASS_SECRET" ]; then
            echo "❌ VERCEL_AUTOMATION_BYPASS_SECRET no configurado"
            echo "   → Settings → Deployment Protection → Protection Bypass for Automation"
            exit 1
          fi
          echo "✅ Bypass secret configurado (${#BYPASS_SECRET} chars)"

      - name: 🔍 Test endpoint de diagnóstico (tickers soportados)
        run: |
          echo "=== GET /api/macro-rlab/etf-holdings?ticker=supported ==="
          HTTP_CODE=$(curl -s -o /tmp/supported.json -w "%{http_code}" \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${PREVIEW_URL}/api/macro-rlab/etf-holdings?ticker=supported")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Endpoint no accesible: HTTP $HTTP_CODE"
            cat /tmp/supported.json | head -5
            exit 1
          fi

          python3 - <<'PYEOF'
          import json, sys
          with open('/tmp/supported.json') as f:
              d = json.load(f)
          tickers = d.get('tickers', [])
          supported = [t['ticker'] for t in tickers if t['status'] == 'supported']
          pending   = [t['ticker'] for t in tickers if t['status'] == 'pending']
          print(f'✅ Endpoint activo — {len(supported)} tickers soportados, {len(pending)} pendientes')
          pilot = [t for t in supported if t in ['XBI','CIBR','SMH','GDX']]
          missing = [t for t in ['XBI','CIBR','SMH','GDX'] if t not in pilot]
          print(f'   Piloto disponible: {pilot}')
          if missing:
              print(f'   ⚠️  Faltan en /supported: {missing}')
          PYEOF

      # ── Helper function instalado como script temporal ────────────────────
      - name: 📊 Test XBI (SPDR/SSGA — XLSX)
        id: xbi
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "  XBI — SPDR Biotech ETF (State Street SSGA)"
          echo "════════════════════════════════════════════"
          START=$(date +%s%3N)
          HTTP_CODE=$(curl -s -o /tmp/xbi.json -w "%{http_code}" \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${PREVIEW_URL}/api/macro-rlab/etf-holdings?ticker=XBI")
          END=$(date +%s%3N)
          ELAPSED=$((END - START))
          echo "HTTP: $HTTP_CODE | Tiempo: ${ELAPSED}ms"

          # FAIL: HTTP distinto de 200
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ FALLO — HTTP $HTTP_CODE (esperado 200)"
            cat /tmp/xbi.json | head -10
            exit 1
          fi

          # FAIL: ok:false o cuerpo inválido
          python3 - <<'PYEOF'
          import json, sys
          with open('/tmp/xbi.json') as f:
              d = json.load(f)
          ok = d.get('ok', False)
          holdings = d.get('holdings', [])
          total_holdings = d.get('totalHoldings', 0)
          total_weight = d.get('totalWeight', 0)
          integrity_ok = d.get('integrityOk', False)

          print(f'  ok:            {ok}')
          print(f'  source:        {d.get("source","N/A")}')
          print(f'  referenceDate: {d.get("referenceDate","N/A")}')
          print(f'  totalHoldings: {total_holdings} posiciones')
          print(f'  cashRows:      {d.get("cashRows",0)} excluidas (cash/collateral)')
          print(f'  totalWeight:   {total_weight:.2f}%')
          print(f'  integrityOk:   {integrity_ok}')
          print(f'  integrityNote: {d.get("integrityNote","N/A")}')
          print(f'  fromCache:     {d.get("fromCache",False)}')

          valid = [h for h in holdings if h.get('ticker') and h.get('ticker') != 'null']
          pct = 100*len(valid)//len(holdings) if holdings else 0
          print(f'')
          print(f'  → ETHAN-analizables: {len(valid)}/{len(holdings)} ({pct}%)')
          print(f'  → Top 5 posiciones:')
          top5 = sorted(holdings, key=lambda x: x.get('weight',0), reverse=True)[:5]
          for h in top5:
              print(f'     {h["ticker"]:8s}  {h.get("weight",0):.2f}%  {h.get("name","")[:40]}')

          errors = []
          if not ok:
              errors.append(f'ok=false: {d.get("error","sin mensaje")}')
          if total_holdings == 0 or not holdings:
              errors.append('0 holdings devueltos')
          if total_weight < 10:
              errors.append(f'totalWeight={total_weight:.2f}% — demasiado bajo')
          if not integrity_ok:
              errors.append(f'integrityOk=false (peso={total_weight:.2f}%)')

          if errors:
              print(f'')
              print(f'❌ FALLO XBI:')
              for e in errors:
                  print(f'   - {e}')
              sys.exit(1)
          else:
              print(f'')
              print(f'✅ XBI OK')
          PYEOF

      - name: 📊 Test CIBR (First Trust — HTML scraping)
        id: cibr
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "  CIBR — First Trust Cybersecurity ETF"
          echo "  (Verificación identidad: CIBR ≠ QTEC)"
          echo "════════════════════════════════════════════"
          START=$(date +%s%3N)
          HTTP_CODE=$(curl -s -o /tmp/cibr.json -w "%{http_code}" \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${PREVIEW_URL}/api/macro-rlab/etf-holdings?ticker=CIBR")
          END=$(date +%s%3N)
          ELAPSED=$((END - START))
          echo "HTTP: $HTTP_CODE | Tiempo: ${ELAPSED}ms"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ FALLO — HTTP $HTTP_CODE (esperado 200)"
            cat /tmp/cibr.json | head -10
            exit 1
          fi

          python3 - <<'PYEOF'
          import json, sys
          with open('/tmp/cibr.json') as f:
              d = json.load(f)
          ok = d.get('ok', False)
          holdings = d.get('holdings', [])
          total_holdings = d.get('totalHoldings', 0)
          total_weight = d.get('totalWeight', 0)
          integrity_ok = d.get('integrityOk', False)

          print(f'  ok:            {ok}')
          print(f'  source:        {d.get("source","N/A")}')
          print(f'  referenceDate: {d.get("referenceDate","N/A")}')
          print(f'  totalHoldings: {total_holdings} posiciones')
          print(f'  totalWeight:   {total_weight:.2f}%')
          print(f'  integrityOk:   {integrity_ok}')

          valid = [h for h in holdings if h.get('ticker') and h.get('ticker') != 'null']
          pct = 100*len(valid)//len(holdings) if holdings else 0
          print(f'')
          print(f'  → ETHAN-analizables: {len(valid)}/{len(holdings)} ({pct}%)')

          # Verificar identidad: CIBR debe tener empresas de ciberseguridad
          tickers_set = set(h.get('ticker','') for h in holdings)
          cibr_expected = {'CRWD', 'PANW', 'ZS', 'FTNT', 'OKTA', 'CSCO'}
          found_cibr = tickers_set & cibr_expected
          print(f'  → Verificación identidad CIBR: ', end='')
          if found_cibr:
              print(f'✅ OK (encontradas: {found_cibr})')
          else:
              print(f'⚠️  No se encontraron tickers esperados de CIBR ({cibr_expected})')

          print(f'  → Top 5 posiciones:')
          top5 = sorted(holdings, key=lambda x: x.get('weight',0), reverse=True)[:5]
          for h in top5:
              print(f'     {h["ticker"]:8s}  {h.get("weight",0):.2f}%  {h.get("name","")[:40]}')

          errors = []
          if not ok:
              errors.append(f'ok=false: {d.get("error","sin mensaje")}')
          if total_holdings == 0 or not holdings:
              errors.append('0 holdings devueltos')
          if total_weight < 10:
              errors.append(f'totalWeight={total_weight:.2f}% — demasiado bajo')
          if not integrity_ok:
              errors.append(f'integrityOk=false (peso={total_weight:.2f}%)')

          if errors:
              print(f'')
              print(f'❌ FALLO CIBR:')
              for e in errors:
                  print(f'   - {e}')
              sys.exit(1)
          else:
              print(f'')
              print(f'✅ CIBR OK')
          PYEOF

      - name: 📊 Test SMH (VanEck — HTML estático offshore)
        id: smh
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "  SMH — VanEck Semiconductor ETF"
          echo "════════════════════════════════════════════"
          START=$(date +%s%3N)
          HTTP_CODE=$(curl -s -o /tmp/smh.json -w "%{http_code}" \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${PREVIEW_URL}/api/macro-rlab/etf-holdings?ticker=SMH")
          END=$(date +%s%3N)
          ELAPSED=$((END - START))
          echo "HTTP: $HTTP_CODE | Tiempo: ${ELAPSED}ms"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ FALLO — HTTP $HTTP_CODE (esperado 200)"
            cat /tmp/smh.json | head -10
            exit 1
          fi

          python3 - <<'PYEOF'
          import json, sys
          with open('/tmp/smh.json') as f:
              d = json.load(f)
          ok = d.get('ok', False)
          holdings = d.get('holdings', [])
          total_holdings = d.get('totalHoldings', 0)
          total_weight = d.get('totalWeight', 0)
          integrity_ok = d.get('integrityOk', False)

          print(f'  ok:            {ok}')
          print(f'  source:        {d.get("source","N/A")}')
          print(f'  referenceDate: {d.get("referenceDate","N/A")}')
          print(f'  totalHoldings: {total_holdings} posiciones')
          print(f'  totalWeight:   {total_weight:.2f}%')
          print(f'  integrityOk:   {integrity_ok}')

          valid = [h for h in holdings if h.get('ticker') and h.get('ticker') != 'null']
          pct = 100*len(valid)//len(holdings) if holdings else 0
          print(f'')
          print(f'  → ETHAN-analizables: {len(valid)}/{len(holdings)} ({pct}%)')
          print(f'  → Top 5 posiciones:')
          top5 = sorted(holdings, key=lambda x: x.get('weight',0), reverse=True)[:5]
          for h in top5:
              print(f'     {h["ticker"]:8s}  {h.get("weight",0):.2f}%  {h.get("name","")[:40]}')

          errors = []
          if not ok:
              errors.append(f'ok=false: {d.get("error","sin mensaje")}')
          if total_holdings == 0 or not holdings:
              errors.append('0 holdings devueltos')
          if total_weight < 10:
              errors.append(f'totalWeight={total_weight:.2f}% — demasiado bajo')
          if not integrity_ok:
              errors.append(f'integrityOk=false (peso={total_weight:.2f}%)')

          if errors:
              print(f'')
              print(f'❌ FALLO SMH:')
              for e in errors:
                  print(f'   - {e}')
              sys.exit(1)
          else:
              print(f'')
              print(f'✅ SMH OK')
          PYEOF

      - name: 📊 Test GDX (VanEck — HTML estático + normalización internacional)
        id: gdx
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "  GDX — VanEck Gold Miners ETF"
          echo "  (Normalización tickers internacionales)"
          echo "════════════════════════════════════════════"
          START=$(date +%s%3N)
          HTTP_CODE=$(curl -s -o /tmp/gdx.json -w "%{http_code}" \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${PREVIEW_URL}/api/macro-rlab/etf-holdings?ticker=GDX")
          END=$(date +%s%3N)
          ELAPSED=$((END - START))
          echo "HTTP: $HTTP_CODE | Tiempo: ${ELAPSED}ms"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ FALLO — HTTP $HTTP_CODE (esperado 200)"
            cat /tmp/gdx.json | head -10
            exit 1
          fi

          python3 - <<'PYEOF'
          import json, sys
          with open('/tmp/gdx.json') as f:
              d = json.load(f)
          ok = d.get('ok', False)
          holdings = d.get('holdings', [])
          total_holdings = d.get('totalHoldings', 0)
          total_weight = d.get('totalWeight', 0)
          integrity_ok = d.get('integrityOk', False)

          print(f'  ok:            {ok}')
          print(f'  source:        {d.get("source","N/A")}')
          print(f'  referenceDate: {d.get("referenceDate","N/A")}')
          print(f'  totalHoldings: {total_holdings} posiciones')
          print(f'  totalWeight:   {total_weight:.2f}%')
          print(f'  integrityOk:   {integrity_ok}')

          us_tickers   = [h for h in holdings if h.get('ticker') and '.' not in h.get('ticker','') and h.get('ticker') != 'null']
          intl_tickers = [h for h in holdings if h.get('ticker') and '.' in h.get('ticker','')]
          null_tickers = [h for h in holdings if not h.get('ticker') or h.get('ticker') == 'null']
          valid        = [h for h in holdings if h.get('ticker') and h.get('ticker') != 'null']
          pct = 100*len(valid)//len(holdings) if holdings else 0

          print(f'')
          print(f'  → US sin sufijo:            {len(us_tickers)}')
          print(f'  → Internacionales (.AX .L): {len(intl_tickers)}')
          print(f'  → No mapeables (null):       {len(null_tickers)}')
          print(f'  → ETHAN-analizables:         {len(valid)}/{len(holdings)} ({pct}%)')

          # Muestra de normalizados
          normalized = [h for h in holdings if h.get('originalTicker') and h.get('ticker') != h.get('originalTicker') and h.get('ticker')]
          if normalized:
              print(f'  → Muestra normalización (hasta 5):')
              for h in normalized[:5]:
                  print(f'     {h.get("originalTicker",""):15s} → {h.get("ticker",""):12s}  {h.get("name","")[:30]}')

          print(f'  → Top 5 posiciones:')
          top5 = sorted(holdings, key=lambda x: x.get('weight',0), reverse=True)[:5]
          for h in top5:
              orig = f' (orig: {h["originalTicker"]})' if h.get('originalTicker') and h.get('originalTicker') != h.get('ticker') else ''
              print(f'     {h["ticker"]:12s}  {h.get("weight",0):.2f}%  {h.get("name","")[:30]}{orig}')

          errors = []
          if not ok:
              errors.append(f'ok=false: {d.get("error","sin mensaje")}')
          if total_holdings == 0 or not holdings:
              errors.append('0 holdings devueltos')
          if total_weight < 10:
              errors.append(f'totalWeight={total_weight:.2f}% — demasiado bajo')
          if not integrity_ok:
              errors.append(f'integrityOk=false (peso={total_weight:.2f}%)')

          if errors:
              print(f'')
              print(f'❌ FALLO GDX:')
              for e in errors:
                  print(f'   - {e}')
              sys.exit(1)
          else:
              print(f'')
              print(f'✅ GDX OK')
          PYEOF

      - name: 📋 Resumen del piloto
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  INFORME PILOTO ETF HOLDINGS — $(date '+%Y-%m-%d %H:%M UTC')"
          echo "  Preview: $PREVIEW_URL"
          echo "════════════════════════════════════════════════════════"
          echo ""
          XBI_STATUS="${{ steps.xbi.outcome }}"
          CIBR_STATUS="${{ steps.cibr.outcome }}"
          SMH_STATUS="${{ steps.smh.outcome }}"
          GDX_STATUS="${{ steps.gdx.outcome }}"

          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          echo "  $(icon $XBI_STATUS)  XBI  (SPDR/SSGA XLSX)         → $XBI_STATUS"
          echo "  $(icon $CIBR_STATUS)  CIBR (First Trust HTML)       → $CIBR_STATUS"
          echo "  $(icon $SMH_STATUS)  SMH  (VanEck HTML offshore)    → $SMH_STATUS"
          echo "  $(icon $GDX_STATUS)  GDX  (VanEck HTML + intl norm) → $GDX_STATUS"
          echo ""

          FAILED=0
          [ "$XBI_STATUS"  != "success" ] && FAILED=$((FAILED+1))
          [ "$CIBR_STATUS" != "success" ] && FAILED=$((FAILED+1))
          [ "$SMH_STATUS"  != "success" ] && FAILED=$((FAILED+1))
          [ "$GDX_STATUS"  != "success" ] && FAILED=$((FAILED+1))

          if [ "$FAILED" -gt 0 ]; then
            echo "  ══ RESULTADO GLOBAL: FAILED ($FAILED/4 ETFs fallaron) ══"
            echo ""
            echo "  ⛔ main NO ha sido modificado — piloto solo en feature/etf-holdings-pilot"
            exit 1
          else
            echo "  ══ RESULTADO GLOBAL: PASSED (4/4 ETFs OK) ══"
            echo ""
            echo "  Pasos siguientes:"
            echo "    1. Verificar Firestore: colección etf_holdings_cache (4 documentos)"
            echo "    2. Probar integración ETHAN en UI: subsector → componentes"
            echo "    3. Autorizar deploy a main (el usuario confirma)"
            echo ""
            echo "  ⛔ main NO ha sido modificado — piloto solo en feature/etf-holdings-pilot"
          fi
