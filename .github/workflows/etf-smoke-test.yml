name: ETF Holdings - Smoke Test Produccion

"on":
  workflow_dispatch:
    inputs:
      preview_url:
        description: URL de produccion Vercel (sin trailing slash)
        required: false
        default: ''

jobs:
  smoke-test:
    name: Smoke Test 4-ETF piloto
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PROD_URL: https://ethan-inversiones-lfxlk8mm4-miguel-angel-s-projects2.vercel.app
      BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configuracion
        run: |
          if [ -n "${{ github.event.inputs.preview_url }}" ]; then
            echo "PROD_URL=${{ github.event.inputs.preview_url }}" >> $GITHUB_ENV
          fi
          echo "URL de produccion: $PROD_URL"
          if [ -z "$BYPASS_SECRET" ]; then
            echo "ERROR: VERCEL_AUTOMATION_BYPASS_SECRET no configurado"
            exit 1
          fi
          echo "Bypass secret OK"

      - name: Descargar holdings XBI
        run: |
          curl -sf -o /tmp/XBI_full.json \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${PROD_URL}/api/macro-rlab/etf-holdings?ticker=XBI"
          cp /tmp/XBI_full.json /tmp/XBI_c2.json

      - name: Descargar holdings CIBR
        run: |
          curl -sf -o /tmp/CIBR_full.json \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${PROD_URL}/api/macro-rlab/etf-holdings?ticker=CIBR"
          cp /tmp/CIBR_full.json /tmp/CIBR_c2.json

      - name: Descargar holdings SOXX
        run: |
          curl -sf -o /tmp/SOXX_full.json \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${PROD_URL}/api/macro-rlab/etf-holdings?ticker=SOXX"
          cp /tmp/SOXX_full.json /tmp/SOXX_c2.json

      - name: Descargar holdings GDX
        run: |
          curl -sf -o /tmp/GDX_full.json \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${PROD_URL}/api/macro-rlab/etf-holdings?ticker=GDX"
          cp /tmp/GDX_full.json /tmp/GDX_c2.json

      - name: Validacion Firestore
        run: python3 .github/scripts/postpilot_firestore.py

      - name: Cobertura Screener ETHAN
        run: python3 .github/scripts/postpilot_screener.py

      - name: Verificacion arquitectura SOXX
        run: python3 .github/scripts/postpilot_arch.py

      - name: Informe final
        if: always()
        run: |
          echo "URL testada: $PROD_URL"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Fecha: $(date -u '+%Y-%m-%d %H:%M UTC')"
          python3 .github/scripts/smoke_report.py
