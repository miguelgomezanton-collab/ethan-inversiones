name: ETF Data Capture
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/etf-capture.py'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar ETFs y generar informe
        env:
          BASE_URL: "https://ethan-inversiones.vercel.app"
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python3 .github/scripts/etf-capture.py
