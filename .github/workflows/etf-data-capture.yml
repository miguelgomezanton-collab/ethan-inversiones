name: ETF Data Capture
on:
  push:
    paths:
      - '.github/workflows/etf-data-capture.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      BASE_URL: "https://ethan-inversiones.vercel.app"
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Consultar ETFs especificos
        run: |
          for TICKER in FDN REMX ARKG KBWB PBS COPX IHI PHO IBUY SKYY FCG ESPO; do
            echo "--- Consultando $TICKER ---"
            BODY=$(curl -sf --max-time 60 \
              -H "x-vercel-protection-bypass: ${BYPASS}" \
              "${BASE_URL}/api/macro-rlab/etf-holdings?ticker=${TICKER}")
            
            if [ -z "$BODY" ]; then
              echo "  ERROR: sin respuesta"
              continue
            fi
            
            echo "$BODY" | python3 -c "
import sys, json
d = json.load(sys.stdin)
h = d.get('holdings', [])
total = len(h)
con_ticker = sum(1 for x in h if x.get('ticker') and x.get('ticker') != 'null')
sin_ticker = total - con_ticker
cobertura = round(con_ticker/total*100, 1) if total > 0 else 0
src = d.get('source', 'unknown')
fecha = d.get('effectiveDate', d.get('referenceDate', 'N/A'))
series_id = d.get('seriesId', 'N/A')
print(f'  Total holdings:  {total}')
print(f'  Con ticker:      {con_ticker}')
print(f'  Sin ticker:      {sin_ticker}')
print(f'  Cobertura:       {cobertura}%')
print(f'  Fuente:          {src}')
print(f'  Fecha efectiva:  {fecha}')
print(f'  SeriesId:        {series_id}')
print(f'  ETHAN OK:        {\"SI\" if con_ticker > 0 else \"NO\"}')
" || echo "  ERROR: fallo parse JSON"
            echo ""
          done
