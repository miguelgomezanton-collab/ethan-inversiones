import json, sys, urllib.request, time

with open('/tmp/xbi_full.json') as f:
    d = json.load(f)

holdings = d.get('holdings', [])
# Top 10 por peso
top10 = sorted(holdings, key=lambda h: h.get('weight',0), reverse=True)[:10]
tickers = [h['ticker'] for h in top10]

print(f"  Muestra top 10 XBI: {tickers}")
print()

# Comprobar si el endpoint de análisis ETHAN acepta estos tickers
# Usamos el endpoint de análisis si existe, o verificamos vía Yahoo Finance directamente
ok_tickers   = []
fail_tickers = []

for t in tickers:
    try:
        url = f"https://query1.finance.yahoo.com/v8/finance/chart/{t}?interval=1d&range=5d"
        req = urllib.request.Request(url, headers={
            'User-Agent': 'Mozilla/5.0'
        })
        with urllib.request.urlopen(req, timeout=8) as resp:
            data = json.loads(resp.read())
            result = data.get('chart', {}).get('result', [])
            if result and result[0].get('meta', {}).get('symbol'):
                ok_tickers.append(t)
            else:
                fail_tickers.append(t)
    except Exception as e:
        fail_tickers.append(f"{t} ({str(e)[:30]})")
    time.sleep(0.3)

print(f"  ✅ Yahoo Finance OK ({len(ok_tickers)}/10): {ok_tickers}")
if fail_tickers:
    print(f"  ⚠️  No procesables ({len(fail_tickers)}): {fail_tickers}")

coverage = len(ok_tickers) / 10 * 100
print(f"\n  Cobertura Yahoo Finance top 10 XBI: {coverage:.0f}%")

result = {
    'etf': 'XBI', 'sample': 10, 'ok': len(ok_tickers),
    'fail': len(fail_tickers), 'fail_tickers': fail_tickers,
    'coverage_pct': coverage
}
with open('/tmp/screener_xbi.json', 'w') as f:
    json.dump(result, f)

if coverage < 70:
    print(f"\n❌ Cobertura XBI demasiado baja: {coverage:.0f}%")
    sys.exit(1)
else:
    print(f"\n✅ Screener XBI OK — cobertura {coverage:.0f}%")
