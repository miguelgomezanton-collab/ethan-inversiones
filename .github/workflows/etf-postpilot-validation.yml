with open('/tmp/xbi_cache.json') as f:
    d = json.load(f)
with open('/tmp/xbi_cache2.json') as f:
    d2 = json.load(f)

ticker       = d.get('ticker', '?')
source       = d.get('source', '?')
ref_date     = d.get('referenceDate', '?')
n_holdings   = d.get('totalHoldings', 0)
total_weight = d.get('totalWeight', 0)
integrity_ok = d.get('integrityOk', False)
integrity_note = d.get('integrityNote', '')
stale        = d.get('stale', False)
