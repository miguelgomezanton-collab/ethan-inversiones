name: ETF Holdings — Validación post-piloto

# Workflow de validación completa antes de autorizar producción.
# Ejecutar manualmente después de que el piloto 4/4 haya pasado.
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Preview URL de Vercel (sin trailing slash)'
        required: false
        default: ''

jobs:
  postpilot-validation:
    name: Validación Firestore + ETHAN screener + Informe de cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PREVIEW_URL: https://ethan-inversiones-6gy72r68c-miguel-angel-s-projects2.vercel.app
      BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: 📋 Configuración
        run: |
          if [ -n "${{ github.event.inputs.preview_url }}" ]; then
            echo "PREVIEW_URL=${{ github.event.inputs.preview_url }}" >> $GITHUB_ENV
          fi
          echo "Preview URL: $PREVIEW_URL"
          if [ -z "$BYPASS_SECRET" ]; then
            echo "❌ VERCEL_AUTOMATION_BYPASS_SECRET no configurado"
            exit 1
          fi
          echo "✅ Bypass secret configurado"

      # ════════════════════════════════════════════════════════
      # BLOQUE 1: VALIDACIÓN FIRESTORE
      # Consulta el endpoint con ?force=false para leer desde caché
      # (no fuerza re-descarga), verificando que Firestore tiene datos.
      # ════════════════════════════════════════════════════════

      - name: 🗄️ Firestore — Verificar caché XBI
        id: cache_xbi
        run: |
          echo ""
          echo "════════════════════════════════════════════════"
          echo "  FIRESTORE CACHE — XBI"
          echo "════════════════════════════════════════════════"

          # Primera llamada — carga/refresca caché
          HTTP=$(curl -s -o /tmp/xbi_cache.json -w "%{http_code}" \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${PREVIEW_URL}/api/macro-rlab/etf-holdings?ticker=XBI")
          echo "HTTP primera llamada: $HTTP"

          sleep 1

          # Segunda llamada — debe venir del caché (latencia mucho menor)
          T1=$(date +%s%N)
          HTTP2=$(curl -s -o /tmp/xbi_cache2.json -w "%{http_code}" \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "${PREVIEW_URL}/api/macro-rlab/etf-holdings?ticker=XBI")
          T2=$(date +%s%N)
          LATENCY_MS=$(( ($T2 - $T1) / 1000000 ))
          echo "HTTP segunda llamada: $HTTP2 | Latencia: ${LATENCY_MS}ms"

          python3 - <<'PYEOF'
