if total_weight < 80:
    errors.append(f'totalWeight={total_weight:.2f}% — muy bajo')
if not integrity_ok:
    errors.append('integrityOk=false')
if stale:
    print("  ⚠️  STALE: datos caducados (>7 días)")

# Verificar que segunda llamada también es ok (caché funcionando)
if not d2.get('ok'):
    errors.append(f'segunda llamada falló: {d2.get("error","?")}')

if errors:
    print(f"\n❌ FALLO XBI cache:")
