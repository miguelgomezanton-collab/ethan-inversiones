        req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
        with urllib.request.urlopen(req, timeout=8) as resp:
            data = json.loads(resp.read())
            result = data.get('chart', {}).get('result', [])
            if result and result[0].get('meta', {}).get('symbol'):
                ok_tickers.append(t)
            else:
                fail_tickers.append(t)
    except Exception as e:
        fail_tickers.append(f"{t} ({str(e)[:30]})")
    time.sleep(0.4)

n = len(tickers)
print(f"  ✅ Yahoo Finance OK ({len(ok_tickers)}/{n}): {ok_tickers}")
if fail_tickers:
    print(f"  ⚠️  No procesables ({len(fail_tickers)}): {fail_tickers}")

# Desglose US vs internacionales
ok_us   = [t for t in ok_tickers if '.' not in t]
ok_intl = [t for t in ok_tickers if '.' in t]
print(f"\n  Cobertura US:            {len(ok_us)}/{len(us_sample)}")
print(f"  Cobertura Internacional: {len(ok_intl)}/{len(intl_sample)}")

coverage = len(ok_tickers) / n * 100 if n > 0 else 0
result = {'etf': 'GDX', 'sample': n, 'ok': len(ok_tickers),
          'fail': len(fail_tickers), 'fail_tickers': fail_tickers,
          'coverage_pct': coverage,
          'ok_us': len(ok_us), 'ok_intl': len(ok_intl),
          'sample_us': len(us_sample), 'sample_intl': len(intl_sample)}
with open('/tmp/screener_gdx.json', 'w') as f:
    json.dump(result, f)

# GDX: umbral más tolerante por tickers internacionales
if coverage < 60:
    print(f"\n❌ Cobertura GDX demasiado baja: {coverage:.0f}%")
    sys.exit(1)
print(f"\n✅ Screener GDX OK — cobertura {coverage:.0f}%")
