import subprocess, sys, json, os

results = {
    'smh_references': [],
    'soxx_references': [],
    'fetcher_tickers': [],
    'adapter_configs': {}
}

# 1. Buscar referencias a SMH en archivos de configuración activa
smh_grep = subprocess.run(
    ['grep', '-rn', 'SMH', 'server/', 'src/'],
    capture_output=True, text=True
)
smh_lines = [l for l in smh_grep.stdout.splitlines()
             if not any(x in l for x in ['node_modules', '.git', '#', '//', '/*', 'SMH →', 'SMH_', 'SMHLD'])]
results['smh_references'] = smh_lines

# 2. Buscar referencias a SOXX
soxx_grep = subprocess.run(
    ['grep', '-rn', 'SOXX', 'server/', 'src/'],
    capture_output=True, text=True
)
soxx_lines = [l for l in soxx_grep.stdout.splitlines()
              if 'node_modules' not in l and '.git' not in l]
results['soxx_references'] = soxx_lines[:20]

# 3. Leer la lista de tickers en fetcher.js
with open('server/etf-holdings/fetcher.js') as f:
    fetcher_content = f.read()

import re
# Buscar arrays de tickers
ticker_matches = re.findall(r"'([A-Z]{2,6})'", fetcher_content)
results['fetcher_tickers'] = ticker_matches

# 4. Verificar config de iShares
with open('server/etf-holdings/sources/ishares.js') as f:
    ishares_content = f.read()

# SOXX debe usar slug ishares-semiconductor-etf (no ishares-phlx-semiconductor-etf)
soxx_slug_match = re.search(r"SOXX.*?slug.*?'([^']+)'", ishares_content, re.DOTALL)
soxx_slug = soxx_slug_match.group(1) if soxx_slug_match else 'NO ENCONTRADO'
soxx_url_pattern = re.search(r"const csvUrl.*?latest-holdings\.csv", ishares_content, re.DOTALL)
results['adapter_configs']['ishares_soxx_slug'] = soxx_slug
results['adapter_configs']['uses_latest_csv'] = bool(soxx_url_pattern)

print("  Configuración SOXX en ishares.js:")
print(f"    Slug: {soxx_slug}")
print(f"    URL patrón /latest-holdings.csv: {results['adapter_configs']['uses_latest_csv']}")

print(f"\n  Tickers registrados en fetcher.js:")
print(f"    {results['fetcher_tickers']}")

print(f"\n  Referencias SMH en código activo:")
if smh_references := results['smh_references']:
    for line in smh_references[:10]:
        print(f"    {line}")
else:
    print("    ✅ Ninguna referencia activa a SMH encontrada")

print(f"\n  Referencias SOXX en código:")
print(f"    {len(results['soxx_references'])} líneas con SOXX")

errors = []

# SMH no debe aparecer en ficheros de config activos (solo en comentarios históricos está bien)
active_smh = [l for l in results['smh_references']
              if not any(c in l for c in ["//", "#", "comment", "histórico"])]
if active_smh:
    errors.append(f"{len(active_smh)} referencias activas a SMH encontradas")

# SOXX debe estar en fetcher.js
if 'SOXX' not in results['fetcher_tickers']:
    errors.append("SOXX no encontrado en fetcher.js")

# Slug correcto
if 'ishares-phlx-semiconductor-etf' in soxx_slug:
    errors.append(f"Slug SOXX todavía usa el slug incorrecto: {soxx_slug}")

if not results['adapter_configs']['uses_latest_csv']:
    errors.append("ishares.js no usa /latest-holdings.csv")

if errors:
    print(f"\n❌ FALLO verificación arquitectura:")
    for e in errors: print(f"   - {e}")
    sys.exit(1)
else:
    print(f"\n✅ Arquitectura OK — SOXX configurado correctamente, sin referencias activas a SMH")

with open('/tmp/arch_check.json', 'w') as f:
    json.dump({'ok': True, 'soxx_slug': soxx_slug,
               'fetcher_tickers': results['fetcher_tickers'],
               'smh_active_refs': len(active_smh)}, f)
