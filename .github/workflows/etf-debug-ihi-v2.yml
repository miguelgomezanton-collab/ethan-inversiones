name: ETF Debug IHI v2
on:
  push:
    paths:
      - '.github/workflows/etf-debug-ihi-v2.yml'
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check IHI CSV con ID 239516
        run: |
          echo "=== Verificando CSV con ID correcto 239516 ==="
          URL="https://www.ishares.com/us/products/239516/ishares-us-medical-devices-etf/latest-holdings.csv"
          echo "URL: $URL"
          
          HEAD=$(curl -sf --max-time 20 -A "Mozilla/5.0" "$URL" 2>&1 | head -5)
          echo "Primeras líneas:"
          echo "$HEAD"
          
          echo ""
          echo "=== Verificando también via API Vercel ==="
          RESP=$(curl -sf --max-time 60 \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" \
            "https://ethan-inversiones.vercel.app/api/macro-rlab/etf-holdings?ticker=IHI")
          echo "Respuesta API: $RESP"
