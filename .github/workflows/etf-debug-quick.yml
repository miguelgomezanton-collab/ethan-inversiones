name: ETF Debug Quick — Sin fail on error

"on":
  workflow_dispatch:
    inputs:
      vercel_url:
        description: 'URL de Vercel preview (ej. https://ethan-xxx.vercel.app)'
        required: true
        type: string

jobs:
  debug:
    name: Debug ${{ matrix.ticker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ticker: [PBS, AIQ, IHI, PAVE, BOTZ, ESPO, FINX, IBUY, AMLP, LIT, NLR, TAN, URA, SIL, REMX, COPX, DTCR, PEJ, PSP, SOCL, KBWB]
    steps:
      - name: Debug ${{ matrix.ticker }}
        env:
          TICKER: ${{ matrix.ticker }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          BASE_URL: ${{ inputs.vercel_url }}
        run: |
          API_URL="${BASE_URL}/api/macro-rlab/etf-holdings?ticker=${TICKER}"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS_CODE:%{http_code}" \
            -H "x-vercel-protection-bypass: ${BYPASS}" \
            "${API_URL}" 2>/dev/null)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1 | sed 's/HTTP_STATUS_CODE://')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS_CODE:/d')
          
          echo "=== ${TICKER} ==="
          echo "HTTP: ${HTTP_CODE}"
          
          if [ "$HTTP_CODE" = "200" ]; then
            OK=$(echo "$BODY" | jq -r '.ok // "?"' 2>/dev/null)
            SOURCE=$(echo "$BODY" | jq -r '.source // "?"' 2>/dev/null)
            TOTAL=$(echo "$BODY" | jq -r '.totalHoldings // 0' 2>/dev/null)
            FRONTEND=$(echo "$BODY" | jq -r '[.holdings[]? | select(.ticker != null and .ticker != "" and .ticker != "null")] | length' 2>/dev/null)
            REF_DATE=$(echo "$BODY" | jq -r '.referenceDate // "?"' 2>/dev/null)
            ERROR=$(echo "$BODY" | jq -r '.error // ""' 2>/dev/null)
            
            echo "ok: ${OK}"
            echo "source: ${SOURCE}"
            echo "referenceDate: ${REF_DATE}"
            echo "totalHoldings: ${TOTAL}"
            echo "frontendValid: ${FRONTEND}"
            if [ -n "$ERROR" ]; then
              echo "error: ${ERROR}"
            fi
            
            echo "--- Con ticker ---"
            echo "$BODY" | jq -r '[.holdings[]? | select(.ticker != null and .ticker != "" and .ticker != "null")] | .[0:3][] | "  ticker=\(.ticker) name=\(.name)"' 2>/dev/null || echo "  (ninguno)"
            
            echo "--- Sin ticker ---"
            echo "$BODY" | jq -r '[.holdings[]? | select(.ticker == null or .ticker == "" or .ticker == "null")] | .[0:3][] | "  name=\(.name) cusip=\(.cusip // "N/A")"' 2>/dev/null || echo "  (ninguno)"
          else
            echo "HTTP ERROR: ${HTTP_CODE}"
            echo "BODY: $(echo "$BODY" | head -c 300)"
          fi
