name: ETF Debug 3 Fallos
on:
  push:
    paths:
      - '.github/workflows/etf-debug-3fallos.yml'

jobs:
  debug-ihi:
    name: Debug IHI
    runs-on: ubuntu-latest
    steps:
      - name: Test IHI via API Vercel
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          RESP=$(curl -sf --max-time 60 \
            -H "x-vercel-protection-bypass: ${BYPASS}" \
            "https://ethan-inversiones.vercel.app/api/macro-rlab/etf-holdings?ticker=IHI" || echo '{"error":"curl_failed"}')
          echo "Respuesta raw: $RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('ok=',d.get('ok'), 'holdings=',len(d.get('holdings',[])), 'error=',d.get('error',''))"

  debug-ibuy-xml:
    name: Debug IBUY XML en EDGAR
    runs-on: ubuntu-latest
    steps:
      - name: Buscar nombre real del XML de IBUY
        run: |
          echo "=== CIK 1633061 submissions ==="
          curl -sf --max-time 15 \
            -H "User-Agent: ETHAN research@ethan.app" \
            "https://data.sec.gov/submissions/CIK0001633061.json" > /tmp/ibuy.json
          python3 << 'PYEOF'
          import json
          with open('/tmp/ibuy.json') as f:
            d = json.load(f)
          rec = d['filings']['recent']
          docs = rec.get('primaryDocument', [])
          for i, (form, acc, pri) in enumerate(zip(rec['form'], rec['accessionNumber'], docs)):
            if form == 'NPORT-P':
              print(f'accession={acc} primaryDoc={pri}')
              if i >= 3:
                break
          PYEOF

  debug-amlp-xml:
    name: Debug AMLP XML en EDGAR
    runs-on: ubuntu-latest
    steps:
      - name: Buscar nombre real del XML de AMLP
        run: |
          echo "=== CIK 1414040 submissions ==="
          curl -sf --max-time 15 \
            -H "User-Agent: ETHAN research@ethan.app" \
            "https://data.sec.gov/submissions/CIK0001414040.json" > /tmp/amlp.json
          python3 << 'PYEOF'
          import json
          with open('/tmp/amlp.json') as f:
            d = json.load(f)
          rec = d['filings']['recent']
          docs = rec.get('primaryDocument', [])
          for i, (form, acc, pri) in enumerate(zip(rec['form'], rec['accessionNumber'], docs)):
            if form == 'NPORT-P':
              print(f'accession={acc} primaryDoc={pri}')
              if i >= 3:
                break
          PYEOF
