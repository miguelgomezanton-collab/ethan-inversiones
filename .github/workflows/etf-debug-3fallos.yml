name: ETF Debug 3 Fallos
on:
  push:
    paths:
      - '.github/workflows/etf-debug-3fallos.yml'

jobs:
  debug-ihi:
    name: Debug IHI
    runs-on: ubuntu-latest
    steps:
      - name: Test IHI via API Vercel
        run: |
          RESP=$(curl -sf --max-time 60 \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" \
            "https://ethan-inversiones.vercel.app/api/macro-rlab/etf-holdings?ticker=IHI")
          echo "Respuesta: $RESP"
          echo "$RESP" | python3 -c "
import sys,json; d=json.load(sys.stdin)
h = d.get('holdings',[])
print(f'ok={d.get(\"ok\")} holdings={len(h)} error={d.get(\"error\",\"\")}')
if h: print(f'First: {h[0]}')
"

  debug-ibuy:
    name: Debug IBUY XML
    runs-on: ubuntu-latest
    steps:
      - name: Buscar XML real de IBUY en EDGAR
        run: |
          # CIK 1633061, buscar filing reciente
          curl -sf --max-time 15 \
            -H "User-Agent: ETHAN research@ethan.app" \
            "https://data.sec.gov/submissions/CIK0001633061.json" | \
            python3 -c "
import sys,json
d=json.load(sys.stdin)
rec=d['filings']['recent']
for i,(f,acc,pri) in enumerate(zip(rec['form'],rec['accessionNumber'],rec.get('primaryDocument',['??']*999))):
    if f=='NPORT-P':
        print(f'accession={acc} primaryDoc={pri}')
        if i>=5: break
"

  debug-amlp:
    name: Debug AMLP XML
    runs-on: ubuntu-latest
    steps:
      - name: Buscar XML real de AMLP en EDGAR
        run: |
          # CIK 1414040
          curl -sf --max-time 15 \
            -H "User-Agent: ETHAN research@ethan.app" \
            "https://data.sec.gov/submissions/CIK0001414040.json" | \
            python3 -c "
import sys,json
d=json.load(sys.stdin)
rec=d['filings']['recent']
for i,(f,acc,pri) in enumerate(zip(rec['form'],rec['accessionNumber'],rec.get('primaryDocument',['??']*999))):
    if f=='NPORT-P':
        print(f'accession={acc} primaryDoc={pri}')
        if i>=5: break
"
